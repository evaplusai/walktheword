<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walk the Word — Edition 1</title>
<style>
  :root{
    --wall:#ECEDE8;
    --paper:#FBFAF5; --paper-2:#F3F1E8;
    --p-ink:#28251A; --p-muted:#7A745F; --p-line:#E4E0D0;
    --gA:#33402C; --gB:#44618C; --gC:#A8721F;
    --lamp:#8A6D1F; --lamp-ink:#6E5617;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root{ --wall:#191C16 } }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--wall);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
       position:relative;overflow:hidden;background:var(--paper);color:var(--p-ink);
       box-shadow:0 0 60px -20px rgba(10,12,8,.35)}

  .appbar{display:flex;align-items:baseline;justify-content:space-between;flex:none;
          padding:calc(14px + env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--p-line)}
  .appbar .book{font-family:var(--serif);font-size:17px;font-weight:600;cursor:pointer}
  .appbar .book .caret{font-size:11px;color:var(--p-muted);margin-left:5px}
  .appbar .loc{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
               text-transform:uppercase;color:var(--p-muted)}

  #retslot{flex:none}
  .retchip{display:inline-flex;align-items:center;gap:7px;margin:10px 20px 0;
           padding:8px 14px;border:1px solid var(--p-line);border-radius:999px;
           font-size:12.5px;background:var(--paper-2);cursor:pointer}
  .retchip .mono{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                 text-transform:uppercase;color:var(--p-muted)}

  #view{flex:1;overflow-y:auto;padding:18px 22px 28px}

  .scripture{font-family:var(--serif);font-size:17px;line-height:1.85;margin:0}
  .scripture .v{font-family:var(--mono);font-size:9.5px;color:var(--p-muted);
                vertical-align:super;margin:0 3px 0 1px}
  .scripture .gap{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                  text-transform:uppercase;color:var(--p-muted);margin:14px 0;text-align:center}
  .land{background:#F3EDD7;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .scripture .super{display:block;font-family:var(--serif);font-style:italic;font-size:13.5px;
                    color:var(--p-muted);margin:0 0 10px}
  /* padding+negative margin: ~44px tap target without disturbing text flow (Design 02 F8) */
  .cx2{color:inherit;text-decoration:none;padding:11px 3px;margin:-8px -2px;cursor:pointer}
  .cx2.A{border-bottom:2px solid var(--gA)}
  .cx2.B{border-bottom:2px dotted var(--gB)}
  .cx2.C{border-bottom:2px dashed var(--gC)}
  @media (hover:hover){ .cx2:hover{background:rgba(138,109,31,.12)} }

  .chip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
        padding:0 6px;border-radius:4px;font:700 11px/1 var(--mono);cursor:pointer;flex:none}
  .chip.A{background:var(--gA);color:#F4F3EA}
  .chip.B{background:var(--gB);color:#F4F3EA}
  .chip.C{background:transparent;color:var(--gC);border:1.5px solid var(--gC)}

  .shelf{border-top:1px solid var(--p-line);display:flex;align-items:stretch;flex:none;
         padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;background:var(--paper)}
  .shelf .ed{flex:none;align-self:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
             text-transform:uppercase;color:var(--p-muted);padding:0 8px 0 6px;cursor:pointer}
  .shelf .nv{flex:1;text-align:center;padding:11px 0;border-radius:9px;font-family:var(--mono);
             font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--p-muted);
             border:1px solid transparent;cursor:pointer;white-space:nowrap;background:none}
  .shelf .nv.on{background:var(--paper-2);color:var(--p-ink);border-color:var(--p-line)}
  .shelf .nv .cnt{color:var(--lamp-ink)}

  .sheet2{position:absolute;left:0;right:0;bottom:0;background:var(--paper);z-index:8;
          border-radius:22px 22px 0 0;border-top:1px solid var(--p-line);
          box-shadow:0 -18px 44px -18px rgba(30,26,12,.35);padding:16px 20px 24px;
          max-height:82%;overflow-y:auto;
          transform:translateY(106%);transition:transform .32s cubic-bezier(.3,.9,.3,1)}
  .sheet2.open{transform:none}
  .scrim{position:absolute;inset:0;background:rgba(24,20,8,.30);z-index:7;opacity:0;
         pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:9;background:var(--p-ink);
         color:var(--paper);font-size:12.5px;line-height:1.5;padding:11px 14px;border-radius:10px;
         opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .25s,transform .25s}
  .toast.on{opacity:1;transform:none}
  @media (prefers-reduced-motion: reduce){ .sheet2,.scrim,.toast{transition:none} }

  .grab{width:36px;height:4px;border-radius:2px;background:var(--p-line);margin:0 auto 14px}
  .cap{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
       color:var(--p-muted);margin:0 0 12px}
  .rel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--p-muted);margin-bottom:10px}
  .rel b{color:var(--p-ink);font-weight:600}
  .target{background:var(--paper-2);border-radius:10px;padding:13px 15px;margin:0 0 12px}
  .target .ref{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
               color:var(--p-muted);margin-bottom:6px}
  .target p{font-family:var(--serif);font-size:15px;line-height:1.6;margin:0}
  .warrant{font-size:12.5px;color:var(--p-muted);margin:0 0 14px}
  .warrant u{color:var(--lamp-ink);text-decoration:underline dotted;cursor:pointer}
  .actions{display:flex;gap:10px}
  .actions .btn{flex:1}
  .btn{text-align:center;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;
       border:1px solid var(--p-line);background:transparent;color:var(--p-ink);cursor:pointer;
       font-family:var(--sans);width:100%}
  .btn.walk{background:var(--gA);border-color:var(--gA);color:#F4F3EA}

  .arc{list-style:none;margin:6px 0 0;padding:0;position:relative}
  .arc::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--p-line)}
  .arc li{position:relative;padding:0 0 18px 30px}
  .arc li:last-child{padding-bottom:0}
  .arc .dot{position:absolute;left:0;top:3px;width:16px;height:16px;border-radius:50%;
            background:var(--paper);border:2.5px solid var(--gA)}
  .arc .dot.B{border-color:var(--gB)} .arc .dot.C{border-style:dashed;border-color:var(--gC)}
  .arc .dot.here{background:var(--lamp);border-color:var(--lamp)}
  .arc h5{font-family:var(--serif);font-size:15px;margin:0 0 2px;font-weight:600}
  .arc .ref{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--p-muted)}
  .arc .ret{float:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
            text-transform:uppercase;color:var(--lamp-ink);cursor:pointer}
  .arc p{font-family:var(--serif);font-size:13px;color:var(--p-muted);line-height:1.5;margin:5px 0 0;cursor:pointer}

  .teach{border:1px solid var(--p-line);border-radius:12px;padding:13px 15px;margin-bottom:11px}
  .teach .row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .teach h6{font-family:var(--serif);font-size:15.5px;margin:0;font-weight:600}
  .teach p{font-size:12.5px;color:var(--p-muted);margin:0;line-height:1.55}
  .teach .ex{font-family:var(--serif);color:var(--p-ink)}
  .skipline{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
            text-transform:uppercase;color:var(--p-muted);margin:12px 0 0;cursor:pointer}
  .bigprompt{font-family:var(--serif);font-size:20px;line-height:1.45;margin:4px 0 16px}

  .door .prompt{font-family:var(--serif);font-size:20px;line-height:1.4;margin:0 0 4px}
  .srow{display:flex;gap:8px;margin:14px 0 8px}
  .srow input{flex:1;border:1.5px solid var(--p-line);border-radius:12px;padding:12px 15px;
              font-size:15px;color:var(--p-ink);background:var(--paper-2);font-family:var(--sans)}
  .srow input:focus{outline:2px solid var(--lamp);outline-offset:1px}
  .srow .btn{width:auto}
  .routesonly{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
              color:var(--p-muted);margin:0 0 12px}
  .sugrow{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
  .sug{border:1px solid var(--p-line);border-radius:999px;padding:7px 12px;font-size:12px;
       cursor:pointer;background:var(--paper-2)}
  .dest{border:1px solid var(--p-line);border-radius:12px;padding:13px 15px;margin-bottom:11px}
  .dest .ref{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
             color:var(--p-muted);display:flex;justify-content:space-between;margin-bottom:6px}
  .dest .ref .go{color:var(--lamp-ink);cursor:pointer}
  .dest p{font-family:var(--serif);font-size:14.5px;line-height:1.55;margin:0 0 6px}
  .dest .why{font-size:11.5px;color:var(--p-muted);margin:0}
  .modecap{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
           color:var(--p-muted);margin:6px 0 10px;display:flex;align-items:center;gap:8px}
  .modecap::after{content:"";flex:1;height:1px;background:var(--p-line)}
  .honest{border-left:3px solid var(--gA);padding:2px 0 2px 14px;margin:4px 0 14px}
  .honest p{font-family:var(--serif);font-size:15.5px;margin:0}
  .cite{border:1px solid var(--p-line);border-radius:10px;padding:11px 13px;margin-bottom:10px}
  .cite .ref{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
             color:var(--p-muted);margin-bottom:4px}
  .cite p{font-family:var(--serif);font-size:13.5px;line-height:1.55;margin:0}
  .openq{font-size:12px;color:var(--p-muted);margin:12px 0 0}
  .quiet{font-size:12px;color:var(--p-muted)}

  .lock{display:flex;gap:8px;align-items:flex-start;background:var(--paper-2);border-radius:10px;
        padding:11px 13px;font-size:12px;color:var(--p-muted);margin:4px 0 16px}
  .entry{border-bottom:1px solid var(--p-line);padding:12px 2px}
  .entry .when{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
               color:var(--p-muted);display:flex;justify-content:space-between;margin-bottom:4px}
  .entry p{font-family:var(--serif);font-size:14.5px;font-style:italic;margin:0}

  .tabs{display:flex;gap:6px;margin:0 0 14px;font-family:var(--mono);font-size:10.5px;
        letter-spacing:.08em;text-transform:uppercase;color:var(--p-muted)}
  .tabs span{padding:6px 12px;border-radius:999px;border:1px solid var(--p-line);cursor:pointer}
  .tabs span.on{background:var(--p-ink);color:var(--paper);border-color:var(--p-ink)}
  .aligned2{background:#EFE9D4;border-radius:4px;padding:2px 3px;cursor:pointer}
  .cmp{margin:14px 0 0;border:1px solid var(--p-line);border-radius:12px;padding:12px 14px}
  .cmp .row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 0;
            border-top:1px solid var(--p-line);font-size:12.5px}
  .cmp .row:first-of-type{border-top:none;padding-top:0}
  .cmp .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
            color:var(--p-muted);padding-top:3px}
  .cmp .row p{font-family:var(--serif);margin:0;line-height:1.5}
  .divergence{margin:16px 0 0;border:1.5px dashed var(--gC);border-radius:10px;
              padding:11px 13px;font-size:12.5px}
  .keyline{margin:16px 0 0;font-size:13px;color:var(--p-muted)}
  .keyline a{color:var(--p-ink);cursor:pointer}

  /* start screen (ADR-005) */
  .trrow{display:flex;gap:10px;margin:0 0 18px}
  .trcard{flex:1;text-align:left;border:1.5px solid var(--p-line);border-radius:12px;
          padding:14px 15px;background:none;cursor:pointer;font-family:var(--sans);color:var(--p-ink)}
  .trcard b{display:block;font-family:var(--serif);font-size:18px;margin-bottom:4px}
  .trcard span{font-size:11.5px;color:var(--p-muted);line-height:1.45;display:block}
  .trcard.on{border-color:var(--gA);background:var(--paper-2)}
  .bookcols{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
  .startbook{min-width:0}
  .startbook:has(.bgrid){flex-basis:100%}
  .bookbtn{font-family:var(--serif);font-size:13.5px;letter-spacing:0;text-transform:none}
  .quietcap{font-family:var(--mono);font-size:9px;letter-spacing:.08em;
            text-transform:uppercase;color:var(--p-muted)}

  .bgrid{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
  .bk{padding:7px 10px;border:1px solid var(--p-line);border-radius:8px;font-family:var(--mono);
      font-size:10.5px;letter-spacing:.06em;color:var(--p-ink);cursor:pointer;background:none}
  .bk.on{background:var(--p-ink);color:var(--paper);border-color:var(--p-ink)}
  .bk.faint{color:var(--p-muted);border-style:dashed;background:transparent}
  .controw{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--p-line);
           border-radius:10px;padding:10px 13px;margin:0 0 6px;background:var(--paper-2);
           font-size:13px;cursor:pointer}
  .controw .mono{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
                 color:var(--lamp-ink)}
  .seccap{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
          color:var(--p-muted);margin:14px 0 8px}
  .edrow{border-top:1px solid var(--p-line);margin-top:16px;padding-top:12px;font-family:var(--mono);
         font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--p-muted);
         display:flex;flex-wrap:wrap;gap:8px 14px}
  .edrow span{cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="appbar">
    <span class="book" id="barBook">Walk the Word</span>
    <span class="loc" id="barLoc">Edition 1</span>
  </div>
  <div id="retslot"></div>
  <main id="view" aria-live="polite"></main>
  <nav class="shelf" aria-label="Main">
    <span class="ed" id="edMark">Ed 1</span>
    <button class="nv" data-nav="books">Books</button>
    <button class="nv" data-nav="trail">Trail <span class="cnt" id="trailCount"></span></button>
    <button class="nv" data-nav="search">Search</button>
    <button class="nv" data-nav="notes">Notes</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="sheet2" id="sh-card" role="dialog" aria-modal="true" aria-label="Connection" tabindex="-1"></div>
  <div class="sheet2" id="sh-books" role="dialog" aria-modal="true" aria-label="Books" tabindex="-1"></div>
  <div class="sheet2" id="sh-trail" role="dialog" aria-modal="true" aria-label="Your trail" tabindex="-1"></div>
  <div class="toast" id="toast" role="status"></div>
</div>
<noscript><p style="max-width:60ch;margin:40px auto;font-family:serif">Walk the Word needs
JavaScript to walk the connections. The edition data itself is plain JSON —
<a href="./data/edition-1.json">read it directly</a>.</p></noscript>
<script type="module" src="./app.js"></script>
</body>
</html>
